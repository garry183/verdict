# Verdict's OWN repo CI (GitHub is Verdict's home — see HANDOFF "ship on GitHub first").
# Consumer pipelines that RUN verdict live under examples/ci/ (GitHub + Bitbucket parity).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # node --test over compiled dist; no-op-safe until test files land.
      - run: npm test --if-present
