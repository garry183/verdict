# Verdict's live proof-case — runs the real e2e demo (tests/login.spec.ts) against
# stageshop.livguard.com and triages the actual result.
#
# Separate from ci.yml on purpose: this hits a live external site, so it must never
# gate merges. Triage runs every time (cheap, no browser beyond the demo test itself).
name: live-e2e

on:
  push:
    branches: [main, selftest]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # Expected to fail (seeded selector drift) — don't let it fail the job; triage
      # is what turns that failure into a verdict.
      - name: Run live e2e demo
        run: npm run e2e
        continue-on-error: true

      # Writes the verdict table straight onto GITHUB_STEP_SUMMARY as a side effect
      # (see cmdTriage in cli.ts) — visible the instant you open the run, no artifact
      # download needed. The HTML dashboard below is still the full detail + trace links.
      - name: Triage
        if: always()
        run: >
          node dist/cli.js triage test-results/results.json
          --json verdict-report.json
          --html verdict-dashboard.html
          --suite e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-results
          path: |
            verdict-report.json
            verdict-dashboard.html
            playwright-report/
            test-results/
          retention-days: 14
