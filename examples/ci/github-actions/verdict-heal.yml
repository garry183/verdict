# CONSUMER EXAMPLE — out-of-band heal. NEVER a PR gate.
# Runs on a schedule / after deploy / manually. Drives a browser + re-runs one test
# per broken locator, then opens a PR a human reviews. This is where CI minutes go —
# by design it only runs on drift, off the critical path.
#
# Parity: mirror of the `verdict-heal` custom pipeline in examples/ci/bitbucket-pipelines.yml.
name: verdict-heal

on:
  schedule:
    - cron: "0 2 * * *"          # nightly 02:00 UTC
  workflow_dispatch: {}          # manual trigger
  # Or after a deployment:
  # workflow_run:
  #   workflows: ["deploy"]
  #   types: [completed]

# NOTE: workflow_dispatch always uses the workflow file on the DEFAULT branch
# (GitHub gotcha) — edits to this job take effect only once merged to main.

permissions:
  contents: write               # push the heal branch
  pull-requests: write          # open the PR

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Heal drives a real browser — install it (triage never needs this).
      - run: npx playwright install --with-deps chromium

      # Obtain the latest Playwright report + trace artifacts (consumer-specific):
      # either re-run the suite here, or download the most recent test-run artifacts.
      # - run: npm run test:e2e            # produces test-results/*.json + traces
      #   continue-on-error: true          # we WANT the failures to heal

      # Discover on the live deploy, gate, apply above threshold, verify by re-run.
      - name: Heal
        run: >
          npx cicd-verdict heal test-results/*.json
          --apply
          --base-url ${{ vars.DEPLOY_URL }}
          --project-dir .
          --log heals.ndjson

      # Open a PR with the healed selectors. Do NOT [skip ci] — we WANT the consumer's
      # normal gate to re-verify the healed locator on the PR.
      - name: Open heal PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: verdict/heal
          title: "verdict: self-heal drifted locators"
          commit-message: "fix(tests): self-heal drifted locators [verdict]"
          body: |
            Automated locator heals from Verdict. Each was applied only above the
            confidence gate and re-run green. Review the diff + heals.ndjson before merge.
          labels: verdict, self-heal

      - uses: actions/upload-artifact@v4
        with:
          name: heals-log
          path: heals.ndjson
          retention-days: 14
