# CONSUMER EXAMPLE — Bitbucket parity for the GitHub workflows in examples/ci/github-actions/.
# One job, kept in lockstep with GitHub (parity axis 1: same resolved commands):
#   • triage — a step after your test step, every run, non-blocking, no browser.
#
# Self-healing (a second, out-of-band heal job) has been removed for now — see the note
# at the top of the repo's README.md. That job's example is preserved on the
# `archive/self-heal` branch if you want to restore it.

image: node:20

definitions:
  caches:
    npm: ~/.npm

pipelines:
  # Runs on branch pushes (parity with GitHub's per-run triage).
  default:
    - step:
        name: e2e
        script:
          - npm ci
          - npm run test:e2e            # ← YOUR tests; must emit test-results/*.json
        artifacts:                       # pass reports to the triage step
          - test-results/**
    - step:
        name: verdict-triage
        caches: [npm]
        script:
          - npm ci
          # Same resolved command as GitHub's triage job. Non-blocking (no --strict).
          - >
            npx cicd-verdict triage test-results/**/*.json
            --json verdict-report.json --html verdict-dashboard.html --suite e2e
        artifacts:
          - verdict-report.json
          - verdict-dashboard.html
